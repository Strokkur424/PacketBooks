[versions]
minecraft = "1.21.11"
paper = "1.21.6-R0.1-SNAPSHOT"

caffeine = "3.2.2"

strokk-config = "1.0.2"
strokk-commands = "2.0.2"

plugin-run = "3.0.2"
plugin-paperweight = "2.0.0-beta.19"
plugin-spotless = "8.1.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
strokk-config-annotations = { module = "net.strokkur:strokk-config-annotations", version.ref = "strokk-config" }
strokk-config-processor = { module = "net.strokkur:strokk-config-processor", version.ref = "strokk-config" }
strokk-commands-annotations = { module = "net.strokkur.commands:annotations-paper", version.ref = "strokk-commands" }
strokk-commands-processor = { module = "net.strokkur.commands:processor-paper", version.ref = "strokk-commands" }

plugin-paperweight-userdev = { module = "io.papermc.paperweight:paperweight-userdev", version.ref = "plugin-paperweight" }
plugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "plugin-spotless" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "plugin-run" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev" }
spotless = { id = "com.diffplug.spotless" }
